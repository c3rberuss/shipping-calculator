name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # El motor de calculo se valida antes de publicar: un desvio en las
      # formulas replicadas debe romper el deploy, no llegar al usuario.
      - run: pnpm test

      # `astro build` no verifica tipos: sin este paso, errores de tipo en el
      # script de la pagina llegan a produccion con el build en verde.
      - run: pnpm check

      # Requiere un paso manual, una sola vez, antes del primer despliegue:
      #
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      #
      # No se puede automatizar. El `enablement: true` de esta accion existe
      # para eso, pero el GITHUB_TOKEN no tiene permiso para crear el sitio y
      # falla con "Resource not accessible by integration"; solo funciona con un
      # token personal, que no vale la pena mantener por un clic.
      - uses: actions/configure-pages@v5

      # `site` y `base` estan fijos en astro.config.mjs (dominio propio).
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
