name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # El motor de calculo se valida antes de publicar: un desvio en las
      # formulas replicadas debe romper el deploy, no llegar al usuario.
      - run: pnpm test

      # `astro build` no verifica tipos: sin este paso, errores de tipo en el
      # script de la pagina llegan a produccion con el build en verde.
      - run: pnpm check

      # `enablement: true` habilita Pages via API en la primera corrida. Sin
      # esto la accion falla con "Get Pages site failed" hasta que alguien lo
      # active a mano en Settings, y el despliegue queda dependiendo de un paso
      # manual que no esta en el repositorio.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
